<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pelatihan Pendamping Proses Produk Halal (PPH)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-blue-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    {% include 'web_awal/header.html' %}

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="container mx-auto px-8 pt-6">
                <div class="max-w-4xl mx-auto space-y-3">
                    {% for category, message in messages %}
                        <div class="p-4 text-white rounded-lg
                            {% if category == 'success' %}
                                bg-green-500
                            {% elif category == 'danger' or category == 'error' %}
                                bg-red-500
                            {% else %}
                                bg-yellow-500
                            {% endif %}
                        ">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
    {% endwith %}

    <!-- Login Form -->
    <main class="flex-grow">
        <div class="container mx-auto px-8 py-20">
            <div class="max-w-4xl mx-auto">
                <h1 class="text-center text-gray-900 text-4xl font-bold mb-6">Login</h1>
                
                <form action="/login" method="POST" class="bg-white rounded-xl shadow-lg p-10">
                    <!-- Email -->
                    <div class="mb-6">
                        <label for="email" class="block text-sm text-gray-600">Email</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com" class="w-full px-4 py-2 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent" required>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-6">
                        <label for="password" class="block text-sm text-gray-600">Password</label>
                        <input type="password" id="password" name="password" placeholder="********" class="w-full px-4 py-2 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-transparent" required>
                    </div>
                    
                    <div class="mb-6">
                        <button type="submit" class="w-full px-6 py-3 bg-purple-700 text-white rounded-full hover:bg-purple-800 transition-all font-medium">
                            Login
                        </button>
                    </div>
                    
                    <p class="text-center text-sm text-gray-600">
                        Belum punya akun? <a href="/daftar" class="text-purple-600 hover:text-purple-700">Daftar di sini</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    {% include 'web_awal/footer.html' %}

</body>
</html>
