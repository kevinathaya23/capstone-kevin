<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Jadwal - Pelatihan Pendamping Proses Produk Halal (PPH)</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-blue-100">

    <!-- Header setelah login -->
    {% include 'headerlog.html' %}

    <div class="container mx-auto px-8 py-20">
        <h1 class="text-3xl font-semibold text-center text-gray-900 mb-6">Edit Jadwal Pelatihan</h1>

        <!-- Form Edit Jadwal -->
        <div class="bg-white p-8 rounded-xl shadow-lg mt-6">
            <h2 class="text-2xl font-semibold text-gray-900 mb-4">Form Edit Jadwal</h2>

            <!-- Form untuk mengedit jadwal -->
            <form method="POST" action="/edit-jadwal/{{ jadwal[0] }}">
                <div class="mb-4">
                    <label for="tanggal" class="block text-sm text-gray-600">Tanggal</label>
                    <input type="date" id="tanggal" name="tanggal" class="w-full px-4 py-2 border-2 border-gray-300 rounded-md" value="{{ jadwal[1] }}" required>
                </div>
                <div class="mb-4">
                    <label for="waktu" class="block text-sm text-gray-600">Waktu</label>
                    <input type="time" id="waktu" name="waktu" class="w-full px-4 py-2 border-2 border-gray-300 rounded-md" value="{{ jadwal[2] }}" required>
                </div>
                <div class="mb-4">
                    <label for="kegiatan" class="block text-sm text-gray-600">Kegiatan</label>
                    <input type="text" id="kegiatan" name="kegiatan" class="w-full px-4 py-2 border-2 border-gray-300 rounded-md" value="{{ jadwal[3] }}" required>
                </div>
                <div class="mb-4">
                    <label for="pic_narasumber" class="block text-sm text-gray-600">PIC/Narasumber</label>
                    <input type="text" id="pic_narasumber" name="pic_narasumber" class="w-full px-4 py-2 border-2 border-gray-300 rounded-md" value="{{ jadwal[4] }}" required>
                </div>
                <button type="submit" class="px-6 py-3 bg-purple-700 text-white rounded-full hover:bg-purple-800 transition-all">Update Jadwal</button>
            </form>
        </div>
    </div>

</body>

</html>
