<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Pelatihan</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-blue-50 via-purple-50 to-blue-100">
        <!-- Header setelah login -->
    {% include 'headerlog.html' %}

    <div class="container mx-auto px-8 py-10">
            <div class="mb-8">
                <h1 class="text-gray-900 text-4xl md:text-5xl font-bold mb-4">Jadwal Pelatihan</h1>
                <p class="text-gray-600">
                    Kelola jadwal pelatihan untuk peserta Pendamping Proses Produk Halal (PPH)
                </p>
            </div>

        <!-- Form untuk menambahkan jadwal -->
        <form method="POST">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="date" name="tanggal" required class="border p-2 rounded">
                <input type="time" name="waktu" placeholder="Waktu" required class="border p-2 rounded">
                <input type="text" name="kegiatan" placeholder="Kegiatan" required class="border p-2 rounded">
                <input type="text" name="pic_narasumber" placeholder="PIC/Narasumber" required class="border p-2 rounded">
            </div>
            <button type="submit" class="mt-4 px-6 py-2 bg-purple-700 text-white rounded-full hover:bg-purple-800 transition-all">Tambah Jadwal</button>
        </form>

        <!-- Tabel Jadwal -->
        <div class="overflow-x-auto mt-10 bg-white shadow-lg rounded-lg">
            <table class="min-w-full table-auto">
                <thead class="bg-purple-700 text-white">
                    <tr>
                        <th class="border p-4 text-left">Tanggal</th>
                        <th class="border p-4 text-left">Waktu</th>
                        <th class="border p-4 text-left">Kegiatan</th>
                        <th class="border p-4 text-left">PIC/Narasumber</th>
                        <th class="border p-4 text-left">Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for jadwal in jadwal_list %}
                    <tr class="border-b">
                        <td class="border p-4">{{ jadwal[1] }}</td>
                        <td class="border p-4">{{ jadwal[2] }}</td>
                        <td class="border p-4">{{ jadwal[3] }}</td>
                        <td class="border p-4">{{ jadwal[4] }}</td>
                        <td class="border p-4">
                            <a href="{{ url_for('edit_jadwal', id=jadwal[0]) }}" class="text-blue-500 hover:underline">Edit</a> |
                            <a href="{{ url_for('hapus_jadwal', id=jadwal[0]) }}" class="text-red-500 hover:underline">Hapus</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
